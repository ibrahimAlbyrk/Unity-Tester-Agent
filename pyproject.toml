[project]
name = "unity-test-agent"
version = "2.0.0"
description = "Unity project compile and test runner with rich CLI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
unity-test-agent = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
